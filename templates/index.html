<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Story</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

<!-- INTRO SCREEN -->
<div class="intro" id="intro">
  <div class="intro-logo">
    <span class="letter-a">A</span>
    <div class="heart">♥</div>
    <span class="letter-m">M</span>
  </div>
</div>

<!-- MAIN SPLASH -->
<div class="splash" id="splash" style="display:none;">
  <div class="splash-logo">Our Story</div>
  <p class="splash-sub">Choose a chapter</p>
  <div class="profiles">
    <div class="profile-card" onclick="openChapter('1-3months')">
      <div class="profile-avatar">L</div>
      <p>1 – 3 Months</p>
    </div>
    <div class="profile-card" onclick="openChapter('3-6months')">
      <div class="profile-avatar">O</div>
      <p>3 – 6 Months</p>
    </div>
    <div class="profile-card" onclick="openChapter('6-12months')">
      <div class="profile-avatar">V</div>
      <p>6 – 12 Months</p>
    </div>
    <div class="profile-card" onclick="openChapter('1year+')">
      <div class="profile-avatar">E</div>
      <p>1 Year +</p>
    </div>
  </div>
</div>

<!-- MEMORIES PAGE -->
<div class="memories-page" id="memoriesPage" style="display:none;">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <h2 class="chapter-title" id="chapterTitle"></h2>
  <div class="memory-grid" id="memoryGrid"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <button class="overlay-close" onclick="closeOverlay()">✕</button>
  <div class="overlay-media" id="overlayMedia"></div>
  <div class="overlay-card">
    <span class="oc-date" id="overlayDate"></span>
    <div class="oc-caption" id="overlayCaption"></div>
    <div class="oc-note" id="overlayNote"></div>
  </div>
</div>

<!-- SUBSCRIPTION POPUP -->
<div class="sub-overlay" id="subOverlay">
  <div class="sub-card">
    <div class="sub-icon">💋</div>
    <h2 class="sub-title">Buy A Subscription</h2>
    <p class="sub-price">3 Kisses</p>
    <p class="sub-desc">This chapter requires payment in kisses before viewing 💛</p>
    <button class="sub-btn" id="subBtn">OK CUTU</button>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
